[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "godshot"
version = "0.1.0"
description = "One continuous shot → verified overhead blocking map + 9:16 reel."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.6",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
godshot = "godshot.__main__:main"

[tool.setuptools.packages.find]
include = ["godshot*"]

[tool.setuptools.package-data]
godshot = ["prompts/*.md", "web/static/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", ".cache", "out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow → and – in strings/comments/docstrings

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_beats: run the real performance_beats() (with fakes) instead of the offline stub"]
